conduct_catalog:
  version: "0.1"
  purpose: >-
    Route responsibilities to the smallest relevant operating guidance. Do not load the
    entire conduct library by default as it grows.

modules:
  C_CORE:
    path: governance/conduct/core.yaml
    load_when:
      - every_responsibility_execution

  C_ACCEPTANCE:
    path: governance/conduct/acceptance.yaml
    load_when:
      - responsibility_may_accept_child_results
      - responsibility_makes_material_semantic_decision

policy:
  unknown_conduct_id: return_upward
  default_loading:
    - C_CORE
  do_not_load_unreferenced_modules: true
