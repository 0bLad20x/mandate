conduct:
  module: C_ACCEPTANCE
  version: "0.1"
  applies_to: responsibilities_with_acceptance_authority

rules:
  C-ACCEPT-001:
    trigger: child_result_received
    instruction: >-
      Evaluate only against the delegated objective and acceptance criteria. Do not ask
      whether the result could be improved in the abstract.

  C-ACCEPT-002:
    trigger: acceptance_decision
    instruction: >-
      Record a short decision basis that cites the acceptance criterion IDs materially
      supporting acceptance or rejection. Prefer concrete contract evidence over general praise.

  C-ACCEPT-003:
    trigger: imperfection_found
    instruction: >-
      An imperfection is not a rejection ground unless it materially violates the contract,
      makes a central conclusion unreliable, prevents downstream use, or breaks required provenance.

  C-ACCEPT-004:
    trigger: new_requirement_discovered
    instruction: >-
      Do not retroactively use a new requirement to reject returned work. Create or amend
      work explicitly through the authorized contract path.

  C-ACCEPT-005:
    trigger: child_result_accepted
    instruction: >-
      Child acceptance closes only the delegated child responsibility/task. It does not
      imply that the accepting responsibility's own parent contract or the run is complete.

  C-ACCEPT-006:
    trigger: acceptance_decision
    instruction: >-
      Do not use percentage completion or quality scores unless the task contract explicitly
      requires a calibrated numeric measure.

  C-ACCEPT-007:
    trigger: acceptance_decision
    required_record:
      outcome:
        enum:
          - ACCEPTED
          - NOT_ACCEPTED
      criteria_basis:
        type: list
        description: acceptance criterion IDs with brief material reasoning
      new_requirements_used_as_rejection_basis:
        const: false
