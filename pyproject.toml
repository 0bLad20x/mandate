[project]
name = "mandate-coordination"
version = "0.1.0"
description = "Semantic coordination contracts and Bootstrap for accountable LLM work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llm-browser-modelrail @ git+https://github.com/0bLad20x/llm-browser-modelrail.git@ce11b4bca2c8d1184f1a56a3da765222bd7b6423",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mandate"]
