[project]
name = "llm-browser-modelrail"
version = "0.1.0"
description = "Browser-backed runtime for referenced Turns in durable LLM Conversations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.60",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelrail", "src/mandate"]
