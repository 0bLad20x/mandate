[project]
name = "mandate"
version = "0.1.0"
description = "Semantic coordination for accountable work and bootstrap"
requires-python = ">=3.12"
dependencies = [
    "llm-browser-modelrail @ git+https://github.com/0bLad20x/llm-browser-modelrail.git@01c09f794c15d9680dff523891cbb6a0a6a7933c",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The Modelrail runtime is intentionally pinned as a direct VCS dependency so the
# integration provenance is part of Mandate's package metadata, not local shell state.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mandate"]
