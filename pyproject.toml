[project]
name = "mandate-coordination"
version = "0.1.0"
description = "Semantic coordination contracts and Bootstrap for accountable LLM work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llm-browser-modelrail @ git+https://github.com/0bLad20x/llm-browser-modelrail.git@b889e6d89136adbe8750caf37f30419a1b7c23fd",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mandate"]
