wp1_observations_not_promoted:
  - id: H_HUMAN_APPROVAL_AT_MATERIAL_COMMITMENT_BOUNDARIES
    status: PRECOMMITMENT_HITL_POSITIVE_LATER_REAPPROVAL_BRANCH_UNPROVEN
    hypothesis: >-
      Human involvement should follow ownership of material commitments rather than fixed workflow step numbers.
      A material proposed change to a human-established accepted commitment must travel upward and may require
      human acceptance.
    evidence: >-
      Proof 004 used two real human clarification boundaries and canonical human input corrected the seed before
      Manifest acceptance. No later responsibility attempted to change an already accepted human commitment.
    enforcement: NONE
  - id: H_TASK_RELEVANT_CONTEXT_PROJECTION
    status: POSITIVE_CROSS_DOMAIN_OBSERVATION_NOT_FULLY_ISOLATED
    hypothesis: >-
      A responsibility should receive the smallest faithful mission/domain/interface context needed to integrate
      its work rather than the complete durable archive by default.
    enforcement: EXPERIMENT_ONLY
  - id: H_TOPOLOGY_ANCHORING_OR_SYMMETRY_BIAS
    status: WEAKENED_BY_CROSS_DOMAIN_REPLICATION_BACKGROUND_OBSERVATION
    evidence: >-
      Proof 003 Keto ended 3/3/3. Proof 004, generated without concrete Keto topology exposure, ended with four
      broad authorities and 2/4/2/3 leaves. Independent checks did not appear mechanically in every subtree.
    enforcement: NONE
    work_triggered: false
  - id: H_ORGANIZATION_CHANGE_REQUIRES_IMPACT_DISPOSITION
    status: UNPROVEN_OBSERVE
    intended_later_work: dynamic organization/lifecycle rebase candidate
    enforcement: NONE
  - id: H_PERIODIC_PROJECT_CONTROL_OR_REVIEW_LAYER
    status: USER_PROPOSED_OBSERVE_AFTER_WP1
    hypothesis: >-
      Long-running multi-domain work may benefit from periodic independent project-level review, milestone/state
      snapshots and deviation detection. WP1 reviewer evidence suggests such behavior should first be expressed
      through ordinary responsibilities plus explicit review contracts rather than a privileged role class.
    enforcement: NONE
    note: >-
      Reassess against WP2-WP5 boundaries before any implementation; do not create cadence, role or gate without
      evidence from long-running work.

wp1_foundation_rule_audit:
  R1_NO_SELF_ACCEPTANCE:
    disposition: KEEP_MATERIALLY_ACTIVE
    evidence: >-
      Clarifier, Architect, Reviewer, broad authorities and leaves returned results upward; the negative review
      itself was accepted by ROOT/RUN-AUTHORITY rather than self-accepted.
  R2_SINGLE_ACCOUNTABILITY:
    disposition: KEEP_MATERIALLY_ACTIVE
    evidence: >-
      Full topologies and the reviewer proof used one accountable parent per responsibility, preserving explicit
      ownership and result routing.
  R3_ACCOUNTABILITY_SURVIVES_DELEGATION:
    disposition: KEEP_MATERIALLY_ACTIVE
    evidence: >-
      Broad authorities integrated child organization; ROOT integrated full topologies; in the reviewer proof ROOT
      remained accountable for judging the reviewer result and returning it upward.
  R4_AUTHORITY_CANNOT_EXPAND_DOWNWARD:
    disposition: KEEP_STRONGLY_ACTIVE
    evidence: >-
      Proof 004 preserved the human trading-only/no-transfer boundary. The negative review actively rejected both
      unauthorized risk-policy modification and transfer/withdrawal authority expansion.
  R5_ACCEPTANCE_IS_CONTRACT_BOUND:
    disposition: KEEP_MATERIALLY_ACTIVE
    evidence: >-
      Positive and negative reviews, ROOT judgments and final Run Authority acceptances were tied to explicit
      mission/task criteria rather than generic best practice or retroactive requirements.
  R6_CONTRACT_OWNERSHIP_REMAINS_UPWARD:
    disposition: KEEP_STRONGLY_ACTIVE
    evidence: >-
      Human answers were not inferred; human input corrected the seed before organization; the reviewer required
      future need for transfer authority or parent risk-policy changes to propagate upward rather than be invented below.
  R7_SIGNALS_TRANSFER_INFORMATION_ONLY:
    disposition: KEEP_UNEXERCISED_AT_RUNTIME
    evidence: >-
      Organization-only proofs modeled interfaces but did not require substantive runtime SIDEWAYS SIGNAL action.
      Lack of exercise is not evidence for deletion or modification.
  R8_RUN_CONTROL_IS_EXPLICIT_AUTHORITY:
    disposition: KEEP_STRONGLY_ACTIVE
    evidence: >-
      RUN-AUTHORITY alone executed human PAUSEs and all final TERMINATE actions; lower responsibilities returned
      results upward.

