current_frontier:
  issue: 35
  objective: >-
    Replicate the complete pre-execution organization pipeline in a materially different domain
    without exposing concrete Keto topology, then compare the independently generated organization
    against the Keto evidence for generalization, topology anchoring/symmetry, context projection,
    and any missing organization semantics before deciding WP1 promotion/closure.

next_experiment:
  id: WP1-ORG-PROOF-004
  seed_issue: 67
  mode: MODELRAIL_LIVE_CROSS_DOMAIN_END_TO_END_ORGANIZATION
  seed_mission: Develop an excellent automated crypto trading system.
  changed_variable: DOMAIN_SWITCH_WITH_KETO_TOPOLOGY_EXCLUDED_FROM_GENERATION
  intent: >-
    Repeat decision-delta human clarification, Mission Manifest creation, fresh initial organization
    proposal/review, recursive organization of every broad authority, and whole-topology integration
    in a new trading domain. No substantive trading, execution, deployment, financial recommendation,
    or implementation is authorized.
  isolation_rule: >-
    Concrete Keto organization artifacts, branch counts, subtree shapes, and role examples are excluded
    from the generation path. Cross-run comparison happens only after terminal.
  activation_semantics_under_test: >-
    Defined-but-unstarted responsibilities keep conversation_id null; responsibility_id is sufficient
    for future routing and the broker binds conversation_id on first actual dispatch. ACTIVE means
    organization membership, not executing state.
  human_escalation_rule: >-
    Do not add a fixed extra human gate. A genuine proposal to revise canonical human intent must travel
    upward and may justify PAUSE; do not manufacture such a conflict.
  reviewer_scope: >-
    Normal independent organization review remains in the pipeline; deliberate negative/revision testing
    is not part of this cross-domain replication.

explicitly_open:
  - whether the organization/clarification principles generalize beyond the Keto domain
  - whether the Keto 3x3 topology reflects mission structure or anchoring/symmetry bias
  - whether decision-delta mission clarification should eventually become reusable pre-organization behavior rather than an experimental responsibility name
  - exact minimal canonical representation of organization design versus run-specific organization state beyond the clarified responsibility identity/activation distinction
  - whether authority/execution distinction needs new schema semantics or is sufficiently expressible through existing authority/task contracts
  - whether responsibility lifecycle needs semantics beyond ACTIVE/RETIRED for post-run persistence; defer unless new evidence requires it
  - whether organization review requires any reusable capability contract after negative-test evidence
  - context projection rules that minimize bias while remaining sufficient
  - how later organization changes disposition already existing work; defer to WP5
  - interface ownership; observe but do not introduce an Interface Manager
  - long-term reporting/artifact design in WP2
  - quality/decision learning protocol in WP3
  - divergence/convergence implementation mechanisms in WP4
  - dynamic organization and closure mechanics in WP5

known_nonblocking_anomalies:
  - Modelrail terminal state and GitHub issue lifecycle/status can diverge; treat as later lifecycle evidence
  - PROJECT_STATE requires explicit projection refresh after live runs
  - Proof 003 contains historical leaf issues whose conversation_id was pre-bound inconsistently; preserve as evidence rather than rewriting history

non_goals_now:
  - add permanent Organization Architect, Mission Clarifier, Reviewer, Auditor, Tester, Consultant, or Interface Manager roles to Core
  - add a fixed generic or trading intake questionnaire
  - add a terminal UI or new Modelrail Core human-input action
  - change Modelrail main
  - perform substantive trading, code deployment, market execution, financial recommendation, or implementation in Proof 004
  - implement runtime organization mutation/impact handling in Proof 004
  - mix reviewer-negative testing into Proof 004
  - expose Keto concrete topology to Proof 004 organization generation
  - use topology similarity, wall-clock duration, token quotas, arbitrary hierarchy depth, or arbitrary worker counts as quality criteria
