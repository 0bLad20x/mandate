project:
  id: mandate
  state_version: "0.5"
  status: ARCHITECTURE_RESEARCH_ACTIVE

accepted_foundation:
  protocol: mandate.coordination@0.1
  rules:
    - R1_NO_SELF_ACCEPTANCE
    - R2_SINGLE_ACCOUNTABILITY
    - R3_ACCOUNTABILITY_SURVIVES_DELEGATION
    - R4_AUTHORITY_CANNOT_EXPAND_DOWNWARD
    - R5_ACCEPTANCE_IS_CONTRACT_BOUND
    - R6_CONTRACT_OWNERSHIP_REMAINS_UPWARD
    - R7_SIGNALS_TRANSFER_INFORMATION_ONLY
    - R8_RUN_CONTROL_IS_EXPLICIT_AUTHORITY
  movements:
    - DELEGATION
    - RESULT
    - SIGNAL
  execution_boundary:
    machine_actions:
      - DISPATCH
      - PAUSE
      - TERMINATE
    broker_runtime_phases:
      - IDLE
      - RUNNING_WAIT
      - PAUSED
      - TERMINAL
    responsibility_conversation_binding: durable
    github_is_canonical_semantic_state: true
    modelrail_is_execution_broker: true

architecture_discipline:
  statement: >-
    Prefer the smallest stable semantic rules that cover whole classes of failure.
    New permanent roles, modes, gates, states, or protocol concepts require evidence that
    existing primitives cannot express the needed behavior cleanly and that the addition
    removes more special cases than it creates.
  external_examples_are_evidence_not_templates: true

historical_evidence:
  foundation_smokes:
    note: >-
      Earlier P0/P1/P2 issues are closed historical evidence. Their original acceptance
      wording and unresolved observations are not retroactively rewritten.
  creative_live_001:
    observation: >-
      A mechanically correct but shallow ROOT-centered creative organization produced a
      formally complete yet substantively weak result. Output decomposition had been
      mistaken for responsibility decomposition.
  creative_studio_live_001:
    observation: >-
      A broader research/challenge studio improved search and reached STAR_GREENLIGHT,
      but still exposed a shallow authority graph, excessive substantive work inside broad
      responsibilities, compressed human-facing output, and rapid convergence.
    terminal: SUCCESS
    epistemic_limit: >-
      STAR_GREENLIGHT was an internal production-candidate judgment, not empirical proof
      of representative audience or market success.
  wp1_org_proof_001:
    seed_issue: 41
    run_id: WP1-ORG-PROOF-001
    terminal: SUCCESS
    run_authority_acceptance: ACCEPTED_P1_P13
    evidence_issues:
      - 42
      - 43
      - 44
      - 45
      - 46
      - 47
    observation: >-
      Live Modelrail evidence supports organization-before-execution, authority/execution
      separation, mission relevance, and recursive organization. A fresh Organization Architect
      proposed three broad authority boundaries, an independent Organization Review returned
      ACCEPTABLE, and accepted RECIPE-SYSTEM-AUTHORITY recursively defined separate development
      and validation execution children without performing substantive cookbook work.
    epistemic_limits:
      - one positive organization case does not promote WP1 hypotheses into foundation rules
      - reviewer rejection/revision behavior was not exercised
      - only one accepted broad authority was recursively decomposed
      - the intentionally underspecified mission left many product-defining dimensions unresolved
    anomalies:
      - seed issue 41 remained open after TERMINATE SUCCESS
      - defined-but-blocked child issues 46 and 47 remained open after the proof
      - project-state projection required explicit refresh after the run

architecture_work_packages:
  sequence:
    - issue: 35
      id: WP1
      title: Mandatory organization design before execution
      state: ACTIVE_FRONTIER
    - issue: 36
      id: WP2
      title: Reporting and project artifact architecture
      state: BACKLOG_AFTER_WP1
    - issue: 37
      id: WP3
      title: Transparent decision and acceptance records
      state: BACKLOG_AFTER_WP2
    - issue: 38
      id: WP4
      title: Divergence, challenge, and convergence protocol
      state: BACKLOG_AFTER_WP3
    - issue: 39
      id: WP5
      title: Dynamic organization, SIGNAL routing, and issue lifecycle audit
      state: BACKLOG_AFTER_WP4

wp1_hypotheses_under_test:
  - id: O1_ORGANIZATION_BEFORE_EXECUTION
    status: POSITIVE_EVIDENCE_ONE_LIVE_PROOF
    hypothesis: >-
      Ordinary domain execution should not begin until an explicit initial organization
      design is persisted and independently challenged.
  - id: O2_AUTHORITY_EXECUTION_SEPARATION
    status: POSITIVE_EVIDENCE_ONE_LIVE_PROOF
    hypothesis: >-
      A non-leaf authority should organize, delegate, integrate, judge, and accept its
      domain rather than substituting for the substantive execution organization beneath it.
  - id: O3_MISSION_RELEVANCE
    status: POSITIVE_EVIDENCE_ONE_LIVE_PROOF
    hypothesis: >-
      Every responsibility/task should identify which inherited obligation, judgment,
      uncertainty, risk, or deliverable it can materially change.
  - id: H_RECURSIVE_ORGANIZATION_DESIGN
    status: POSITIVE_EVIDENCE_ONE_LIVE_PROOF
    hypothesis: >-
      Initial organization should establish justified authority/domain topology rather than
      predict the complete leaf graph; broad authorities should recursively design their own
      child execution structure before doing substantive work.
  - id: H_MISSION_CLARIFICATION_BY_DECISION_DELTA
    status: NEXT_LIVE_TEST
    hypothesis: >-
      Before organization design, unresolved mission dimensions should be clarified only when
      materially different plausible answers could change mission scope, product direction,
      organization/domain weighting, authority boundaries, or acceptance criteria.
    intended_mechanism: >-
      Use a dedicated experimental MISSION-CLARIFICATION responsibility plus existing PAUSE and
      explicit operator reactivation. Do not add a terminal UI or a new Modelrail Core action.
    enforcement: EXPERIMENT_ONLY

wp1_observations_not_yet_rules:
  - id: H_ORGANIZATION_CHANGE_REQUIRES_IMPACT_DISPOSITION
    status: UNPROVEN_OBSERVE
    hypothesis: >-
      When an authorized organization change adds or materially changes responsibility boundaries,
      the accountable authority may need to disposition effects on already existing obligations,
      tasks, assumptions, and accepted results rather than merely append a new node.
    intended_wp: WP5
    enforcement: NONE
  - id: H_REVIEW_CAPABILITY_PATTERN
    status: UNPROVEN_OBSERVE
    hypothesis: >-
      Repeated evidence may eventually justify a reusable review/audit capability contract, but one
      successful fresh reviewer conversation is insufficient to create a permanent reviewer class.
    next_evidence: reviewer negative/revision proof after mission-clarification comparison
    enforcement: NONE

wp1_manual_scratch:
  issue: 40
  status: NON_CANONICAL_FOR_ACCEPTANCE
  note: >-
    Issue #40 contains an assistant-authored same-context dry-run used only to sharpen the
    experimental questions. It did not execute through Modelrail, had no independent review,
    produced no durable responsibility trace, and must not be used as proof.

open_hypotheses:
  - id: H_OBLIGATION_NO_IMPLICIT_DISCHARGE
    status: UNPROVEN_OBSERVE
    enforcement: NONE
  - id: H_DISPATCHED_CONTRACT_IMMUTABILITY
    status: UNPROVEN_OBSERVE
    enforcement: NONE
  - id: H_ORDINARY_DELEGATOR_EQUALS_PARENT
    status: UNPROVEN_OBSERVE
    enforcement: NONE
  - id: H_RETIREMENT_REQUIRES_CLEAR_OBLIGATIONS
    status: DEFERRED_UNPROVEN
    enforcement: NONE

current_frontier:
  issue: 35
  objective: >-
    Hold the domain constant and test whether decision-delta-driven human mission clarification
    before organization design materially improves the Keto responsibility topology and contracts
    without introducing a fixed questionnaire, UI protocol, domain taxonomy, or unnecessary governance.

next_experiment:
  id: WP1-ORG-PROOF-002
  seed_issue: 48
  mode: MODELRAIL_LIVE_HUMAN_IN_LOOP
  changed_variable: MISSION_CLARIFICATION_BEFORE_ORGANIZATION
  baseline_run: WP1-ORG-PROOF-001
  intent: >-
    Start from the same broad Keto seed. A fresh MISSION-CLARIFICATION responsibility derives a
    minimal human question batch from material decision deltas. RUN-AUTHORITY pauses using the
    existing PAUSE control after the clarification request is canonical. The operator persists the
    human response in GitHub and explicitly reactivates the same run. Clarification continues in the
    same responsibility conversation until a compact Mission Manifest is sufficient, after which the
    normal Organization Architect -> independent Review -> recursive broad-authority proof proceeds.
  comparison_rule: >-
    Do not reward topology similarity. Compare whether clarified mission intent reduces material
    uncertainty and produces more justified domain existence, weighting, authority boundaries, and
    recursive decomposition while preserving flexibility.

explicitly_open:
  - whether decision-delta mission clarification is necessary enough to become a reusable pre-organization behavior
  - exact minimal canonical representation of organization design
  - whether authority/execution distinction needs new schema semantics or is sufficiently expressible through existing authority/task contracts
  - whether responsibility lifecycle needs semantics beyond current identity/task/status behavior for persistent staff versus temporary consultants
  - whether organization review requires any reusable capability contract after negative-test evidence
  - context projection rules so specialists receive sufficient mission/interface context without full-archive flooding
  - how later organization changes disposition already existing work; defer to WP5
  - interface ownership; observe but do not introduce an Interface Manager
  - long-term reporting/artifact design in WP2
  - quality/decision learning protocol in WP3
  - divergence/convergence implementation mechanisms in WP4
  - dynamic organization and closure mechanics in WP5

non_goals_now:
  - promote WP1 hypotheses into accepted foundation rules from one positive proof
  - add permanent Organization Architect, Mission Clarifier, Reviewer, Auditor, Tester, or Interface Manager roles to Core
  - add a fixed Keto or generic intake questionnaire
  - add a terminal UI or new Modelrail Core human-input action
  - change Modelrail main
  - implement dynamic organization mutation/impact handling in Proof 002
  - switch domains before the same-seed clarification comparison is complete
  - use topology similarity, wall-clock duration, token quotas, or arbitrary iteration counts as quality criteria
