      Compact persistent ownership boundary stating which inherited mission obligation, judgment, uncertainty,
      risk or deliverable the responsibility materially owns or can change and therefore why the node exists.
    prohibited_scope: >-
      Bounded list of material adjacent authority/ownership the responsibility must not absorb.
    task_objective: >-
