project:
  id: mandate
  state_version: "0.1"
  status: FOUNDATION_PROOF_ACTIVE

accepted_foundation:
  protocol: mandate.coordination@0.1
  rules:
    - R1_NO_SELF_ACCEPTANCE
    - R2_SINGLE_ACCOUNTABILITY
    - R3_ACCOUNTABILITY_SURVIVES_DELEGATION
    - R4_AUTHORITY_CANNOT_EXPAND_DOWNWARD
    - R5_ACCEPTANCE_IS_CONTRACT_BOUND
    - R6_CONTRACT_OWNERSHIP_REMAINS_UPWARD
    - R7_SIGNALS_TRANSFER_INFORMATION_ONLY
    - R8_RUN_CONTROL_IS_EXPLICIT_AUTHORITY
  movements:
    - DELEGATION
    - RESULT
    - SIGNAL
  execution_boundary:
    machine_actions:
      - DISPATCH
      - PAUSE
      - TERMINATE
    broker_runtime_phases:
      - IDLE
      - RUNNING_WAIT
      - PAUSED
      - TERMINAL
    responsibility_conversation_binding: durable
    github_is_canonical_semantic_state: true
    modelrail_is_execution_broker: true

foundation_proof:
  parent_issue: 1
  sequence:
    - issue: 2
      id: P0
      objective: multi-turn happy path with parallel workers and same-conversation follow-up
      state: RETRY_AFTER_OBSERVED_RUNTIME_FAILURE
    - issue: 3
      id: P1
      objective: contract-bound rejection and correction
      state: BLOCKED_BY_P0
    - issue: 4
      id: P2
      objective: restart without duplicate dispatch
      state: BLOCKED_BY_P1

observed_failures:
  - id: P0-F001
    run_id: P0-LIVE-001
    classification: BROKER_PROTOCOL_OVERMODELED
    observation: >-
      RUNNING_WAIT was exposed as an Assistant-emitted handoff even though waiting is derivable
      from broker queue/pending state. After the initial worker frontier completed, the Root emitted
      RUNNING_WAIT with no remaining broker work, producing RUNNING_WAIT_WITHOUT_OTHER_WORK and the
      same failure on resume.
    correction_result: >-
      RUNNING_WAIT was removed from Assistant actions and retained only as broker-internal runtime
      state. P0-LIVE-002 passed this former failure point, so the simplification is supported by the
      next live run.

  - id: P0-F002
    run_id: P0-LIVE-002
    classification: MODELRAIL_POST_SUBMIT_VISIBILITY_REPLAY
    observation: >-
      The corrected broker reached Run Authority -> Root -> parallel FEASIBILITY and OPTIMALITY
      worker execution. Both workers persisted canonical RESULT records in GitHub. On the first
      addressed return to the existing ROOT conversation, one Modelrail SEND returned success and
      was then issued again with the same internal turn id before materialization became visible,
      producing DUPLICATE_BLOCKED / DUPLICATE_MATERIALIZATION.
    evidence: >-
      The trace shows the same logical ROOT turn id sent twice. The external broker had submitted
      one pending TurnRef; the duplicate arose inside Conversation progression while recovering a
      SUBMIT_RETURNED turn from an immediate NOT_MATERIALIZED read.
    correction_under_test: >-
      Validate the already-isolated minimal Modelrail behavior: when delivery_state is
      SUBMIT_RETURNED, immediate NOT_MATERIALIZED is not replay authority; preserve the durable
      turn and wait for materialization. Keep replay after positively proven absence for genuinely
      ambiguous/crash-recovery states. Test this on a dependent experimental branch without
      changing Modelrail main or adding Mandate governance.

open_hypotheses:
  posture: >-
    These are observations to falsify or support in live runs. They are not protocol rules,
    validator requirements, or implementation commitments. Prefer simplifying an existing rule or
    state transition before promoting a new invariant.

  candidates:
    - id: H_OBLIGATION_NO_IMPLICIT_DISCHARGE
      status: UNPROVEN_OBSERVE
      hypothesis: >-
        A delegated obligation may need an explicit lifecycle invariant preventing it from disappearing
        after FAILED, INCOMPLETE, replacement work, or organizational change without acceptance,
        supersession/withdrawal, or run termination.
      evidence_needed: >-
        Observe whether an unresolved delegated obligation can actually disappear or become ownerless
        in live runs under the current eight rules and contracts.
      enforcement: NONE

    - id: H_DISPATCHED_CONTRACT_IMMUTABILITY
      status: UNPROVEN_OBSERVE
      hypothesis: >-
        A dispatched contract may need an immutable identity or explicit revision lineage so later
        acceptance can prove which objective and criteria governed execution.
      evidence_needed: >-
        Observe whether live coordination produces ambiguous, silently changed, or disputed task
        contracts and whether existing GitHub history plus R5/R6 is insufficient.
      enforcement: NONE

    - id: H_ORDINARY_DELEGATOR_EQUALS_PARENT
      status: UNPROVEN_OBSERVE
      hypothesis: >-
        Ordinary downward delegation may need a deterministic invariant that the task delegator equals
        the assignee's accountable parent, otherwise sideways work assignment could bypass SIGNAL-only
        semantics.
      evidence_needed: >-
        Observe whether current agents ever create a task for a responsibility they do not own and what
        semantic problem, if any, results.
      enforcement: NONE

    - id: H_RETIREMENT_REQUIRES_CLEAR_OBLIGATIONS
      status: DEFERRED_UNPROVEN
      hypothesis: >-
        A responsibility may need to remain non-retirable while it owns unresolved obligations or active
        children so accountability cannot become orphaned.
      evidence_needed: >-
        Evaluate only once live runs actually exercise responsibility retirement or reorganization.
      enforcement: NONE

current_frontier:
  objective: >-
    Validate only the observed post-submit visibility replay correction on the dependent Modelrail
    experimental branch, rerun P0 with a fresh run id if deterministic checks pass, and continue
    observing coordination behavior without adding governance or abstractions.
  issue: 2

explicitly_open:
  - exact long-term persisted run/organization artifact layout after P0 evidence
  - validator implementation beyond the narrow broker boundary checks exercised by P0
  - bootstrap/grill-me intake protocol before runtime organization creation
  - role profiles beyond explicit responsibility and authority
  - conduct rules earned from observed coordination failures
  - policy for deliberate independent fresh-perspective conversations

non_goals_now:
  - promote open hypotheses into rules without live evidence
  - contract revision/versioning before a concrete ambiguity is observed
  - fixed universal organization chart
  - universal role library
  - research-specific workflow
  - automatic task-count quotas
  - broad supervisor hierarchy before a concrete failure requires it
