post_wp1_baseline:
  id: POST-WP1-BASELINE-001
  state_version: "0.9"
  purpose: >-
    Stable planning basis after WP1 closure. Use this baseline to reassess the remaining architecture work rather
    than treating pre-WP1 issue sequence or wording as automatically current.
  fixed_for_rebase:
    - R1-R8 remain the accepted coordination foundation
    - O1/O2/O3 and recursive organization are accepted WP1 architecture principles
    - independent organization revision capability is required behavior, not a privileged Reviewer role class
    - responsibility@0.3 and task@0.2 are the minimum canonical organization representation produced by WP1
    - decision-delta human clarification is strongly supported behavior using existing PAUSE/reactivation, not a new Core primitive
    - organization shape, role names, child counts and hierarchy depth remain mission-derived and unconstrained by templates
    - Modelrail remains execution underlay; GitHub remains semantic/control authority
  must_be_reassessed_before_next_wp_activation:
    - whether issue #36 still cleanly owns reporting, project-state snapshots, milestone summaries and long-running control-report artifacts
    - whether issue #37 should absorb reusable evidence-to-rule-to-consequence decision/review records or whether that belongs partly in #36/#38
    - whether issue #38 still cleanly owns divergence/challenge/convergence now that independent review behavior is proven through ordinary responsibility contracts
    - whether issue #39 should be broadened or narrowed around dynamic organization mutation, SIGNAL routing, responsibility retirement and GitHub issue lifecycle projection
    - whether the user-proposed periodic project-level control/review concept is one cross-cutting capability or should emerge from the existing WP2-WP5 responsibilities without a new work package
    - whether original WP2-WP5 ordering remains justified after these boundary changes
  rule_for_rebase: >-
    Do not preserve the old work-package sequence merely because it was previously written. Compare each remaining
    issue against this accepted baseline, remove solved material, move misplaced questions, identify missing gaps,
    and only then choose the next active frontier.

