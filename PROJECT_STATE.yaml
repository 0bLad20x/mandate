project:
  id: mandate
  state_version: "0.6"
  status: ARCHITECTURE_RESEARCH_ACTIVE

accepted_foundation:
  protocol: mandate.coordination@0.1
  rules:
    - R1_NO_SELF_ACCEPTANCE
    - R2_SINGLE_ACCOUNTABILITY
    - R3_ACCOUNTABILITY_SURVIVES_DELEGATION
    - R4_AUTHORITY_CANNOT_EXPAND_DOWNWARD
    - R5_ACCEPTANCE_IS_CONTRACT_BOUND
    - R6_CONTRACT_OWNERSHIP_REMAINS_UPWARD
    - R7_SIGNALS_TRANSFER_INFORMATION_ONLY
    - R8_RUN_CONTROL_IS_EXPLICIT_AUTHORITY
  movements:
    - DELEGATION
    - RESULT
    - SIGNAL
  execution_boundary:
    machine_actions:
      - DISPATCH
      - PAUSE
      - TERMINATE
    broker_runtime_phases:
      - IDLE
      - RUNNING_WAIT
      - PAUSED
      - TERMINAL
    responsibility_conversation_binding: durable
    github_is_canonical_semantic_state: true
    modelrail_is_execution_broker: true

architecture_discipline:
  statement: >-
    Prefer the smallest stable semantic rules that cover whole classes of failure.
    New permanent roles, modes, gates, states, or protocol concepts require evidence that
    existing primitives cannot express the needed behavior cleanly and that the addition
    removes more special cases than it creates.
  external_examples_are_evidence_not_templates: true

historical_evidence:
  foundation_smokes:
    note: >-
      Earlier P0/P1/P2 issues are closed historical evidence. Their original acceptance
      wording and unresolved observations are not retroactively rewritten.
  creative_live_001:
    observation: >-
      A mechanically correct but shallow ROOT-centered creative organization produced a
      formally complete yet substantively weak result. Output decomposition had been
      mistaken for responsibility decomposition.
  creative_studio_live_001:
    observation: >-
      A broader research/challenge studio improved search and reached STAR_GREENLIGHT,
      but still exposed a shallow authority graph, excessive substantive work inside broad
      responsibilities, compressed human-facing output, and rapid convergence.
    terminal: SUCCESS
    epistemic_limit: >-
      STAR_GREENLIGHT was an internal production-candidate judgment, not empirical proof
      of representative audience or market success.
  wp1_org_proof_001:
    seed_issue: 41
    run_id: WP1-ORG-PROOF-001
    terminal: SUCCESS
    run_authority_acceptance: ACCEPTED_P1_P13
    evidence_issues: [42, 43, 44, 45, 46, 47]
    observation: >-
      Live evidence supports organization-before-execution, authority/execution separation,
      mission relevance, and recursive organization. One accepted broad recipe authority
      recursively defined separate development and validation execution children without
      substantive cookbook work.
    epistemic_limits:
      - reviewer rejection/revision behavior was not exercised
      - only one accepted broad authority was recursively decomposed
      - the intentionally underspecified mission left many product-defining dimensions unresolved
  wp1_org_proof_002:
    seed_issue: 48
    run_id: WP1-ORG-PROOF-002
    terminal: SUCCESS
    run_authority_acceptance: ACCEPTED_Q1_Q14
    evidence_issues: [49, 50, 51, 52, 53, 54, 55, 56]
    observation: >-
      Decision-delta mission clarification worked live through two real PAUSE/operator-
      reactivation cycles in one durable MISSION-CLARIFICATION conversation. Canonical human
      responses reduced material mission ambiguity and produced an accepted Mission Manifest
      before organization design. The clarified mission produced sharper authority boundaries
      and a RECIPE-PORTFOLIO-AUTHORITY subtree with separate discovery/provenance,
      development/adaptation, and independent practicality/portfolio checking responsibilities.
    comparison_to_proof_001: >-
      Clarification improved contract specificity and recursive decomposition rationale without
      requiring a larger top-level headcount. Lower-impact details remained explicitly deferred.
    epistemic_limits:
      - the concrete experimental role names are not foundation doctrine
      - no fixed clarification-round count is justified
      - organization review again returned ACCEPTABLE on the first proposal; REVISION_REQUIRED remains unproven
      - only the recipe broad authority was recursively decomposed; the other two broad domains remain unresolved below their authority boundaries
      - no substantive cookbook execution was authorized

architecture_work_packages:
  sequence:
    - issue: 35
      id: WP1
      title: Mandatory organization design before execution
      state: ACTIVE_FRONTIER_HARDENING
    - issue: 36
      id: WP2
      title: Reporting and project artifact architecture
      state: BACKLOG_AFTER_WP1
    - issue: 37
      id: WP3
      title: Transparent decision and acceptance records
      state: BACKLOG_AFTER_WP2
    - issue: 38
      id: WP4
      title: Divergence, challenge, and convergence protocol
      state: BACKLOG_AFTER_WP3
    - issue: 39
      id: WP5
      title: Dynamic organization, SIGNAL routing, and issue lifecycle audit
      state: BACKLOG_AFTER_WP4

wp1_hypotheses_under_test:
  - id: O1_ORGANIZATION_BEFORE_EXECUTION
    status: STRONG_POSITIVE_EVIDENCE_TWO_LIVE_PROOFS
    hypothesis: >-
      Ordinary domain execution should not begin until an explicit initial organization
      design is persisted and independently challenged.
  - id: O2_AUTHORITY_EXECUTION_SEPARATION
    status: STRONG_POSITIVE_EVIDENCE_TWO_LIVE_PROOFS
    hypothesis: >-
      A non-leaf authority should organize, delegate, integrate, judge, and accept its
      domain rather than substituting for the substantive execution organization beneath it.
  - id: O3_MISSION_RELEVANCE
    status: STRONG_POSITIVE_EVIDENCE_TWO_LIVE_PROOFS
    hypothesis: >-
      Every responsibility/task should identify which inherited obligation, judgment,
      uncertainty, risk, or deliverable it can materially change.
  - id: H_RECURSIVE_ORGANIZATION_DESIGN
    status: POSITIVE_EVIDENCE_PARTIAL_TOPOLOGY
    hypothesis: >-
      Initial organization should establish justified authority/domain topology rather than
      predict the complete leaf graph; broad authorities should recursively design their own
      child execution structure before doing substantive work.
    next_evidence: >-
      Complete the still-unresolved Keto-integrity and Product-experience subtrees and then
      assess the whole topology from ROOT's cross-domain perspective.
  - id: H_MISSION_CLARIFICATION_BY_DECISION_DELTA
    status: STRONG_POSITIVE_EVIDENCE_ONE_LIVE_HUMAN_PROOF
    hypothesis: >-
      Before organization design, unresolved mission dimensions should be clarified only when
      materially different plausible answers could change mission scope, product direction,
      organization/domain weighting, authority boundaries, or acceptance criteria.
    observed_mechanism: >-
      Existing PAUSE plus explicit operator reactivation was sufficient; no terminal UI or new
      Modelrail Core action was required. The same responsibility/conversation continued across
      multiple human rounds and stopped when only lower-impact unknowns remained.
    enforcement: EXPERIMENTAL_WORKING_BASIS

wp1_observations_not_yet_rules:
  - id: H_HUMAN_APPROVAL_AT_MATERIAL_COMMITMENT_BOUNDARIES
    status: UNPROVEN_OBSERVE
    hypothesis: >-
      Human involvement should follow ownership of material commitments rather than fixed workflow
      step numbers. A lower responsibility may refine work inside accepted delegated authority, but
      should not silently rewrite a commitment established by canonical human input. A material
      proposed change to such a commitment must travel upward and may require human acceptance.
    next_evidence: >-
      Observe naturally during recursive organization and later runs; do not manufacture a human
      pause merely to exercise the path.
    enforcement: NONE
  - id: H_ORGANIZATION_CHANGE_REQUIRES_IMPACT_DISPOSITION
    status: UNPROVEN_OBSERVE
    hypothesis: >-
      When an authorized organization change adds or materially changes responsibility boundaries,
      the accountable authority may need to disposition effects on already existing obligations,
      tasks, assumptions, and accepted results rather than merely append a new node.
    intended_wp: WP5
    enforcement: NONE
  - id: H_REVIEW_CAPABILITY_PATTERN
    status: UNPROVEN_OBSERVE
    hypothesis: >-
      Repeated evidence may eventually justify a reusable review/audit capability contract, but two
      first-pass ACCEPTABLE organization reviews are insufficient to create a permanent reviewer class.
    next_evidence: reviewer negative/revision proof after current organization hardening
    enforcement: NONE
  - id: H_TASK_RELEVANT_CONTEXT_PROJECTION
    status: PROVISIONAL_OBSERVE
    hypothesis: >-
      A responsibility should receive the smallest faithful mission/domain/interface context needed
      to integrate its work rather than the complete durable archive by default.
    enforcement: EXPERIMENT_ONLY

wp1_manual_scratch:
