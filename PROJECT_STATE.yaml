wp1_hypotheses_under_test:
  - id: O1_ORGANIZATION_BEFORE_EXECUTION
    status: STRONG_POSITIVE_EVIDENCE_FOUR_LIVE_PROOFS_TWO_DOMAINS
    hypothesis: >-
      Ordinary domain execution should not begin until an explicit initial organization
      design is persisted and independently challenged.
  - id: O2_AUTHORITY_EXECUTION_SEPARATION
    status: STRONG_POSITIVE_EVIDENCE_FULL_TOPOLOGIES_TWO_DOMAINS
    hypothesis: >-
      A non-leaf authority should organize, delegate, integrate, judge, and accept its
      domain rather than substituting for the substantive execution organization beneath it.
    schema_implication: >-
      Current evidence does not justify a new AUTHORITY/EXECUTION kind in the core responsibility enum.
      Existing parent identity, authority booleans, delegated tasks/results, and bounded responsibility
      contracts expressed the separation in Proof 004.
  - id: O3_MISSION_RELEVANCE
    status: STRONG_POSITIVE_EVIDENCE_FULL_TOPOLOGIES_TWO_DOMAINS
    hypothesis: >-
      Every responsibility/task should identify which inherited obligation, judgment,
      uncertainty, risk, or deliverable it can materially change.
    representation_implication: >-
      Mission relevance is clearly useful, but current evidence does not yet establish whether it requires
      a new formal responsibility field or is sufficiently carried by responsibility boundary text plus
      task objective/acceptance/context.
  - id: H_RECURSIVE_ORGANIZATION_DESIGN
    status: STRONG_POSITIVE_EVIDENCE_FULL_TOPOLOGIES_TWO_DOMAINS
    hypothesis: >-
      Initial organization should establish justified authority/domain topology rather than
      predict the complete leaf graph; broad authorities should recursively design their own
      child execution structure before doing substantive work.
  - id: H_MISSION_CLARIFICATION_BY_DECISION_DELTA
    status: STRONG_POSITIVE_EVIDENCE_TWO_LIVE_HUMAN_PROOFS_CROSS_DOMAIN
    hypothesis: >-
      Before organization design, unresolved mission dimensions should be clarified only when
      materially different plausible answers could change mission scope, product direction,
      organization/domain weighting, authority boundaries, or acceptance criteria.
    observed_mechanism: >-
      Existing PAUSE plus explicit operator reactivation was sufficient; no terminal UI or new
      Modelrail Core action was required. Proof 004 additionally showed that canonical human input
      can materially correct the seed before Manifest acceptance and organization design.
    enforcement: EXPERIMENTAL_WORKING_BASIS

wp1_observations_not_yet_rules:
  - id: H_HUMAN_APPROVAL_AT_MATERIAL_COMMITMENT_BOUNDARIES
    status: PRECOMMITMENT_HITL_POSITIVE_REAPPROVAL_BRANCH_UNPROVEN
    hypothesis: >-
      Human involvement should follow ownership of material commitments rather than fixed workflow
      step numbers. A lower responsibility may refine work inside accepted delegated authority, but
      should not silently rewrite a commitment established by canonical human input. A material
      proposed change to such a commitment must travel upward and may require human acceptance.
    evidence: >-
      Proof 004 used two real human clarification boundaries and canonical human input corrected the seed
      before Manifest acceptance. No later responsibility proposed changing an already accepted human commitment,
      so no re-approval PAUSE was naturally required. Current evidence does not justify a fixed extra post-Manifest
      or post-organization human gate; existing R6 plus R8 already express the needed ownership/run-control path.
    enforcement: NONE
  - id: H_TASK_RELEVANT_CONTEXT_PROJECTION
    status: POSITIVE_CROSS_DOMAIN_OBSERVATION_NOT_FULLY_ISOLATED
    hypothesis: >-
      A responsibility should receive the smallest faithful mission/domain/interface context needed
      to integrate its work rather than the complete durable archive by default.
    evidence: >-
      Proof 004 excluded concrete Keto organization artifacts from the generation path and still produced
      a coherent, materially different organization. Exact minimal/bias-optimal context remains unisolated.
    enforcement: EXPERIMENT_ONLY
  - id: H_TOPOLOGY_ANCHORING_OR_SYMMETRY_BIAS
    status: WEAKENED_BY_CROSS_DOMAIN_REPLICATION_KEEP_OBSERVE
    hypothesis: >-
      Prior visible organization examples may anchor later authorities toward similar branch counts,
      checker patterns, or decomposition shape even when each local rationale is plausible.
    evidence: >-
      Proof 003 Keto ended 3/3/3. Proof 004, generated without concrete Keto topology exposure, ended
      with four broad authorities and 2/4/2/3 leaves. Independent checks did not appear mechanically in
      every subtree. Two domains are not universal proof, but no further work is currently triggered.
    enforcement: NONE
  - id: H_ORGANIZATION_CHANGE_REQUIRES_IMPACT_DISPOSITION
    status: UNPROVEN_OBSERVE
    hypothesis: >-
      When an authorized organization change adds or materially changes responsibility boundaries,
      the accountable authority may need to disposition effects on already existing obligations,
      tasks, assumptions, and accepted results rather than merely append a new node.
    intended_wp: WP5
    enforcement: NONE
  - id: H_REVIEW_CAPABILITY_PATTERN
    status: POSITIVE_REVIEW_STRUCTURE_NEGATIVE_PATH_UNPROVEN
    hypothesis: >-
      Independent organization challenge is repeatedly useful, but first-pass ACCEPTABLE reviews do not
      establish reliable rejection/revision behavior or justify a permanent Reviewer/Auditor class.
    next_evidence: narrow reviewer-negative/revision capability test if WP1-A7 is to be literally satisfied
    enforcement: NONE

wp1_foundation_rule_audit_proof_004:
  R1_NO_SELF_ACCEPTANCE:
    disposition: MATERIALLY_ACTIVE_KEEP
    effect: >-
      Clarifier, Architect, Reviewer, broad authorities, and execution leaves returned results upward;
      no responsibility authoritatively accepted its own delegated work.
  R2_SINGLE_ACCOUNTABILITY:
    disposition: MATERIALLY_ACTIVE_KEEP
    effect: >-
      Every broad authority and all eleven leaves had exactly one accountable parent, enabling adjacent
      ownership boundaries to remain explicit.
  R3_ACCOUNTABILITY_SURVIVES_DELEGATION:
    disposition: MATERIALLY_ACTIVE_KEEP
    effect: >-
      Broad authorities integrated their child organization and ROOT integrated all broad results into the
      complete package; child completion did not discharge parent accountability.
  R4_AUTHORITY_CANNOT_EXPAND_DOWNWARD:
    disposition: STRONGLY_ACTIVE_KEEP
    effect: >-
      The canonical trading-only/no-withdrawal/no-transfer/no-custody boundary constrained Risk, Market
      Execution, and System Assurance child design and did not expand downward.
  R5_ACCEPTANCE_IS_CONTRACT_BOUND:
    disposition: MATERIALLY_ACTIVE_KEEP
    effect: >-
      Review, ROOT acceptance, child integration, and RUN-AUTHORITY final acceptance remained tied to the
      accepted Mission Manifest and explicit delegated/seed criteria rather than newly invented requirements.
  R6_CONTRACT_OWNERSHIP_REMAINS_UPWARD:
    disposition: STRONGLY_ACTIVE_KEEP
    effect: >-
      Human answers were not inferred; the human corrected the seed before Manifest acceptance; later
      responsibilities were prohibited from silently changing canonical human mission/capital authority.
  R7_SIGNALS_TRANSFER_INFORMATION_ONLY:
    disposition: NOT_RUNTIME_EXERCISED_NO_DELETION_SIGNAL
    effect: >-
      Interfaces were modeled, but organization-only execution required no SIDEWAYS SIGNAL action. This is
      not anomalous and supplies no evidence to remove or modify R7.
  R8_RUN_CONTROL_IS_EXPLICIT_AUTHORITY:
    disposition: STRONGLY_ACTIVE_KEEP
    effect: >-
      RUN-AUTHORITY alone executed two PAUSE actions and final TERMINATE SUCCESS; lower responsibilities
      only returned results upward.

wp1_simplification_findings:
  no_new_core_role_classes:
    status: SUPPORTED
    note: >-
      MISSION-CLARIFICATION, ORGANIZATION-ARCHITECT, ORGANIZATION-REVIEW, Reviewer/Auditor/Tester,
      Consultant, and Interface Manager names are not justified as permanent Core role classes. The useful
      behavior was expressed by ordinary responsibility/task contracts and existing governance.
  no_new_human_input_primitive:
    status: SUPPORTED
    note: Existing PAUSE/reactivation is sufficient for observed human-input behavior.
  no_new_authority_execution_kind:
    status: SUPPORTED_FOR_NOW
    note: >-
      Descriptive BROAD_NON_LEAF_AUTHORITY/EXECUTION_LEAF classifications were useful evidence labels, but
      Proof 004 did not demonstrate a need to expand the current kind enum. Keep deterministic authority via
      parent/authority/task constraints unless a later failure shows a missing enforcement primitive.
  no_new_whole_topology_protocol_gate:
    status: SUPPORTED_FOR_NOW
    note: >-
      Whole-topology integration was valuable, but ROOT's obligation follows from R3 accountability survival
      plus R5 contract-bound acceptance. The artifact is useful; a new machine action/state is not justified.
  mission_manifest_is_artifact_pattern_not_core_type:
    status: SUPPORTED_FOR_NOW
    note: >-
      The durable semantic requirement is resolution or explicit deferral of material decision deltas before
      organization. The current evidence does not require a permanent Core artifact type named Mission Manifest.
  avoid_new_responsibility_lifecycle_states:
    status: SUPPORTED_FOR_NOW
    note: >-
      ACTIVE as organization membership plus nullable conversation_id was sufficient in Proof 004. Post-run
      retirement/persistence remains WP5 evidence and does not justify extra execution-like status values here.

responsibility_representation:
  contract_version: "0.2"
  clarified_semantics:
    responsibility_id: >-
      Stable canonical accountability/routing identity. It exists independently of whether an
      execution conversation has been started.
    conversation_id: >-
      Durable Modelrail execution-context binding. It remains null for a canonically defined but
      never-dispatched responsibility and is bound by the broker on first actual dispatch.
    active_status: >-
      Organizational membership/not-retired only. ACTIVE does not mean conversation-created,
      task-released, queued, pending, or currently executing.
  proof_004_regression: PASS_ALL_ELEVEN_UNSTARTED_LEAVES_NULL
  remaining_representation_question: >-
    Decide the smallest canonical place for persistent responsibility-domain ownership/material contribution,
    result boundary, and prohibited scope. Do not create a separate rich organization ontology unless the
    existing Responsibility graph plus Task objective/acceptance/context cannot carry these semantics cleanly.

wp1_closure_assessment:
  status: CLOSURE_CANDIDATE_WITH_TWO_BOUNDED_OPEN_ITEMS
  core_mechanism_disposition: >-
    Organization-before-execution, mission relevance, authority/execution separation, recursive organization,
    decision-delta clarification, full-topology integration, and corrected activation semantics now have strong
    live evidence including one full cross-domain replication.
  literal_open_items:
    - id: WP1_A7_REVIEW_REVISION_CAPABILITY
      blocker_type: BEHAVIORAL_ACCEPTANCE_BRANCH_UNPROVEN
      reason: >-
        Issue #35 explicitly requires that independent organization review can reject or require revision.
        Every live organization review so far returned ACCEPTABLE. Positive reviews cannot establish the
        negative/revision path. Keep this as a narrow separate capability question rather than another domain proof.
    - id: MINIMUM_CANONICAL_ORGANIZATION_REPRESENTATION
      blocker_type: DELIVERABLE_DESIGN_DECISION
      reason: >-
        The evidence argues against a separate rich organization schema, but #35 still requires a minimal canonical
        representation and ownership/parent-contribution map. Decide whether existing Responsibility + Task contracts
        are sufficient or whether one minimal responsibility-level boundary field is necessary.
  nonblocking_later_work:
    - runtime organization mutation and impact disposition -> WP5
    - responsibility retirement/lifecycle and issue-state projection -> WP5
    - runtime SIGNAL behavior under substantive cross-domain execution -> later evidence/WP5
    - reporting/artifact hierarchy -> WP2
    - transparent decision learning -> WP3
    - divergence/convergence mechanisms -> WP4
    - topology symmetry/anchoring -> background observation only
    - single quiescence recovery -> runtime observation only unless repeated

wp1_manual_scratch:
  issue: 40
  status: NON_CANONICAL_FOR_ACCEPTANCE
  note: >-
    Issue #40 is assistant-authored same-context scratch evidence only. It did not execute through
    Modelrail and must not be used as proof.

