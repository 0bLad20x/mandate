explicitly_open_after_wp1:
  - exact universal organization-topology generality beyond two domains; background observation only
  - exact minimal/bias-optimal context projection
  - later human re-approval when accepted human commitments are materially changed after organization begins
  - runtime SIGNAL behavior and interface ownership under substantive cross-domain execution
  - dynamic organization mutation and impact disposition
  - responsibility retirement and GitHub issue lifecycle projection
  - long-running reporting, milestone/state snapshot and project-control architecture
  - reusable decision/review record semantics and learning from decisions
  - divergence/challenge/convergence behavior beyond the pre-execution organization review proven in WP1
  - whether periodic project-level review/control becomes a reusable capability in long-running work

known_nonblocking_anomalies:
  - Modelrail terminal state and GitHub issue lifecycle/status can diverge; treat as later lifecycle evidence
  - PROJECT_STATE requires explicit projection refresh after live runs
  - Proof 003 contains historical leaf issues whose conversation_id was pre-bound inconsistently; preserve as evidence rather than rewriting history
  - Proof 004 terminal broker state recorded one successful quiescence recovery resolved on attempt 1; exact cause is unknown and no Core change is justified from one event
  - WP1 reviewer proof ran without quiescence/protocol/transport recovery, so the Proof-004 quiescence event did not immediately recur

non_goals_at_post_wp1_baseline:
  - reopen WP1 solely to accumulate more domains or reviewer examples
  - add permanent Organization Architect, Mission Clarifier, Reviewer, Auditor, Tester, Consultant, Project Controller, or Interface Manager roles without later evidence of a missing general capability
  - add a fixed generic/domain intake questionnaire
  - add a terminal UI or new Modelrail Core human-input action
  - add a new authority/execution kind without a demonstrated enforcement gap
  - add a permanent whole-topology machine gate/action
  - add extra responsibility lifecycle states before later lifecycle evidence
