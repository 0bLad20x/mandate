current_frontier:
  issue: 35
  objective: >-
    Finish the same-mission WP1 organization proof by recursively decomposing the two broad accepted
    authorities that remain unresolved below the top-level topology, then integrate all three domain
    subtrees from a bird's-eye perspective before deciding WP1 closure/promotion.

next_experiment:
  id: WP1-ORG-PROOF-003
  seed_issue: 57
  mode: MODELRAIL_LIVE_FULL_RECURSIVE_ORGANIZATION
  inherited_run: WP1-ORG-PROOF-002
  changed_variable: COMPLETE_REMAINING_BROAD_AUTHORITY_DECOMPOSITION_AND_WHOLE_TOPOLOGY_ASSESSMENT
  intent: >-
    Inherit the accepted Proof 002 Mission Manifest, accepted top-level topology, and accepted recipe
    subtree. Fresh KETO-INTEGRITY-AUTHORITY and PRODUCT-EXPERIENCE-AUTHORITY responsibilities each
    derive their own sufficient child execution organization from task-relevant mission/interface
    context. ROOT then integrates all three subtrees and persists a FULL_PRE_EXECUTION_ORGANIZATION_PACKAGE.
  human_escalation_rule: >-
    Do not add a fixed human gate. If live organization work discovers a genuine need to revise a
    commitment established by canonical human input, return it upward; only RUN-AUTHORITY may PAUSE.
    Do not manufacture such a conflict.
  reviewer_scope: >-
    Reviewer-negative/revision testing is explicitly not part of this proof.

explicitly_open:
  - whether decision-delta mission clarification should eventually become reusable pre-organization behavior rather than an experimental responsibility name
  - exact minimal canonical representation of organization design versus run-specific organization state
  - whether authority/execution distinction needs new schema semantics or is sufficiently expressible through existing authority/task contracts
  - whether responsibility lifecycle needs semantics beyond current identity/task/status behavior for persistent staff versus temporary consultants
  - whether organization review requires any reusable capability contract after negative-test evidence
  - context projection rules so specialists receive sufficient mission/interface context without full-archive flooding
  - how later organization changes disposition already existing work; defer to WP5
  - interface ownership; observe but do not introduce an Interface Manager
  - long-term reporting/artifact design in WP2
  - quality/decision learning protocol in WP3
  - divergence/convergence implementation mechanisms in WP4
  - dynamic organization and closure mechanics in WP5

known_nonblocking_anomalies:
  - Modelrail terminal state and GitHub issue lifecycle/status can diverge; treat as later lifecycle evidence
  - PROJECT_STATE requires explicit projection refresh after live runs

non_goals_now:
  - add permanent Organization Architect, Mission Clarifier, Reviewer, Auditor, Tester, Consultant, or Interface Manager roles to Core
  - add a fixed generic intake questionnaire
  - add a terminal UI or new Modelrail Core human-input action
  - change Modelrail main
  - perform substantive Keto/cookbook execution in Proof 003
  - implement runtime organization mutation/impact handling in Proof 003
  - mix reviewer-negative testing into Proof 003
  - switch domains before the current same-mission organization hardening is complete
  - use topology similarity, wall-clock duration, token quotas, arbitrary hierarchy depth, or arbitrary worker counts as quality criteria
