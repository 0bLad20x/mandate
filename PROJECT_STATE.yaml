project:
  id: mandate
  state_version: "0.8"
  status: ARCHITECTURE_RESEARCH_ACTIVE

accepted_foundation:
  protocol: mandate.coordination@0.1
  rules:
    - R1_NO_SELF_ACCEPTANCE
    - R2_SINGLE_ACCOUNTABILITY
    - R3_ACCOUNTABILITY_SURVIVES_DELEGATION
    - R4_AUTHORITY_CANNOT_EXPAND_DOWNWARD
    - R5_ACCEPTANCE_IS_CONTRACT_BOUND
    - R6_CONTRACT_OWNERSHIP_REMAINS_UPWARD
    - R7_SIGNALS_TRANSFER_INFORMATION_ONLY
    - R8_RUN_CONTROL_IS_EXPLICIT_AUTHORITY
  movements:
    - DELEGATION
    - RESULT
    - SIGNAL
  execution_boundary:
    machine_actions:
      - DISPATCH
      - PAUSE
      - TERMINATE
    broker_runtime_phases:
      - IDLE
      - RUNNING_WAIT
      - PAUSED
      - TERMINAL
    responsibility_conversation_binding: durable
    github_is_canonical_semantic_state: true
    modelrail_is_execution_broker: true

architecture_discipline:
  statement: >-
    Prefer the smallest stable semantic rules that cover whole classes of failure.
    New permanent roles, modes, gates, states, or protocol concepts require evidence that
    existing primitives cannot express the needed behavior cleanly and that the addition
    removes more special cases than it creates.
  external_examples_are_evidence_not_templates: true

historical_evidence:
  foundation_smokes:
    note: >-
      Earlier P0/P1/P2 issues are closed historical evidence. Their original acceptance
      wording and unresolved observations are not retroactively rewritten.
  creative_live_001:
    observation: >-
      A mechanically correct but shallow ROOT-centered creative organization produced a
      formally complete yet substantively weak result. Output decomposition had been
      mistaken for responsibility decomposition.
  creative_studio_live_001:
    observation: >-
      A broader research/challenge studio improved search and reached STAR_GREENLIGHT,
      but still exposed a shallow authority graph, excessive substantive work inside broad
      responsibilities, compressed human-facing output, and rapid convergence.
    terminal: SUCCESS
    epistemic_limit: >-
      STAR_GREENLIGHT was an internal production-candidate judgment, not empirical proof
      of representative audience or market success.
  wp1_org_proof_001:
    seed_issue: 41
    run_id: WP1-ORG-PROOF-001
    terminal: SUCCESS
    run_authority_acceptance: ACCEPTED_P1_P13
    evidence_issues: [42, 43, 44, 45, 46, 47]
    observation: >-
      Live evidence supports organization-before-execution, authority/execution separation,
      mission relevance, and recursive organization. One accepted broad recipe authority
      recursively defined separate development and validation execution children without
      substantive cookbook work.
    epistemic_limits:
      - reviewer rejection/revision behavior was not exercised
      - only one accepted broad authority was recursively decomposed
      - the intentionally underspecified mission left many product-defining dimensions unresolved
  wp1_org_proof_002:
    seed_issue: 48
    run_id: WP1-ORG-PROOF-002
    terminal: SUCCESS
    run_authority_acceptance: ACCEPTED_Q1_Q14
    evidence_issues: [49, 50, 51, 52, 53, 54, 55, 56]
    observation: >-
      Decision-delta mission clarification worked live through two real PAUSE/operator-
      reactivation cycles in one durable MISSION-CLARIFICATION conversation. Canonical human
      responses reduced material mission ambiguity and produced an accepted Mission Manifest
      before organization design. The clarified mission produced sharper authority boundaries
      and a RECIPE-PORTFOLIO-AUTHORITY subtree with separate discovery/provenance,
      development/adaptation, and independent practicality/portfolio checking responsibilities.
    comparison_to_proof_001: >-
      Clarification improved contract specificity and recursive decomposition rationale without
      requiring a larger top-level headcount. Lower-impact details remained explicitly deferred.
    epistemic_limits:
      - the concrete experimental role names are not foundation doctrine
      - no fixed clarification-round count is justified
      - organization review again returned ACCEPTABLE on the first proposal; REVISION_REQUIRED remains unproven
      - only the recipe broad authority was recursively decomposed in this proof
      - no substantive cookbook execution was authorized
  wp1_org_proof_003:
    seed_issue: 57
    run_id: WP1-ORG-PROOF-003
    terminal: SUCCESS
    run_authority_acceptance: ACCEPTED_F1_F12
    evidence_issues: [58, 59, 60, 61, 62, 63, 64, 65, 66]
    full_pre_execution_package: WP1-ORG-PROOF-003-FULL-PRE-EXECUTION-ORGANIZATION-PACKAGE-001
    disposition: COHERENT
    observation: >-
      The two remaining broad authorities independently derived bounded child execution
      organization while remaining non-leaf. ROOT integrated the inherited recipe subtree plus
      the new Keto-integrity and Product-experience subtrees and found no current material
      coverage gap, conflicting ownership, sibling-scope leakage, authority/execution collapse,
      unjustified over-organization, interface-induced omission, contradiction, or improper
      promotion of deferred unknowns. The accepted three-domain top-level partition survived
      full recursive decomposition. All substantive execution remained blocked.
    positive_human_boundary_observation: >-
      Neither broad authority discovered a genuine conflict with canonical human commitments or
      accepted top-level authority, so no artificial PAUSE was created. This supports autonomous
      resolution inside delegated authority but does not exercise the escalation branch.
    anomalies:
      - some defined-but-never-dispatched Keto execution leaves were persisted with deterministic non-null conversation_id values, while equivalent Product leaves correctly used null
      - all organization-only/future execution responsibilities use ACTIVE although execution is blocked; current interpretation is organizational membership, not running state
      - the completed topology is notably symmetric with three execution children beneath each broad authority; each rationale is plausible, but anchoring/symmetry bias remains untested
      - Modelrail terminal state and GitHub issue lifecycle/status can still diverge
    corrective_evidence: >-
      Broker routing already uses responsibility_id as target identity and creates/binds the
      durable conversation on first actual DISPATCH. Therefore pre-binding a deterministic future
      conversation id is unnecessary and contradicts the responsibility contract semantics.
  wp1_org_proof_004:
    seed_issue: 67
    run_id: WP1-ORG-PROOF-004
    terminal: SUCCESS
    run_authority_acceptance: ACCEPTED_T1_T15
    evidence_issues: [68, 69, 70, 71, 72, 73, 74, 75, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 86]
    full_pre_execution_package: WP1-ORG-PROOF-004-FULL-PREEXEC-ORG-1
    disposition: COHERENT
    post_run_assessment_comment: 5385962085
    mission_manifest: WP1-ORG-PROOF-004-MISSION-MANIFEST-1
    observation: >-
      Cross-domain replication completed the full pre-execution organization pipeline in a materially
      different trading domain without exposing concrete Keto topology during generation. Decision-delta
      clarification used two real PAUSE/reactivation cycles and then produced a Mission Manifest that
      incorporated the canonical human correction excluding crypto from the original seed. A fresh Architect
      proposed four broad authorities, fresh independent Review returned ACCEPTABLE, every broad authority
      recursively produced its own child execution organization, ROOT integrated the whole topology, and no
      substantive trading/domain execution was released.
    trading_topology:
      top_level_authorities:
        - STRATEGY-EVIDENCE-AUTHORITY
        - RISK-CAPITAL-AUTHORITY
        - MARKET-EXECUTION-AUTHORITY
        - SYSTEM-ASSURANCE-AUTHORITY
      subtree_leaf_counts:
        STRATEGY-EVIDENCE-AUTHORITY: 2
        RISK-CAPITAL-AUTHORITY: 4
        MARKET-EXECUTION-AUTHORITY: 2
        SYSTEM-ASSURANCE-AUTHORITY: 3
      total_execution_leaves: 11
    cross_domain_comparison: >-
      Keto full recursive topology was 3 broad authorities with 3/3/3 children. Trading independently
      produced 4 broad authorities with 2/4/2/3 children. This materially weakens the earlier symmetry/
      anchoring concern and supports mission-derived decomposition, while two domains are not universal proof.
    activation_regression: >-
      All eleven defined-but-never-dispatched execution leaves retained conversation_id null and ACTIVE was
      treated as organization membership only, providing live corrective evidence for the Proof-003 anomaly.
    runtime_observation: >-
      Terminal broker state recorded exactly one successful quiescence recovery after the final broad-authority
      return, resolved on attempt 1. There were no protocol recoveries, transport repairs, recovery block,
      pending work, or semantic proof failure. Exact cause is not established; keep as non-blocking observation.
    epistemic_limits:
      - reviewer REVISION_REQUIRED behavior remains unproven because the fresh review again returned ACCEPTABLE
      - two domains support cross-domain generalization but do not prove universal topology behavior
      - no substantive execution occurred, so runtime SIGNAL use and dynamic organization mutation were not exercised
      - no later proposal attempted to revise an already accepted human commitment, so the human re-approval branch remains unproven

