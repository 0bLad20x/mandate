current_frontier:
  issue: 35
  objective: >-
    Finish WP1 closure work without another broad domain proof: resolve the minimum canonical organization
    representation and either behaviorally exercise the narrow WP1-A7 reviewer revision branch or explicitly
    decide that the existing acceptance boundary must remain open. Do not let later-WP lifecycle/SIGNAL/reporting
    questions expand WP1.

next_experiment:
  id: null
  reason: >-
    No Proof 005 is justified by topology symmetry or cross-domain generalization alone. If a live experiment
    is run before WP1 closure, it should be narrowly scoped to the still-unproven WP1-A7 reviewer revision capability,
    not a third domain organization run.

explicitly_open:
  - WP1-A7 reviewer REVISION_REQUIRED behavior
  - minimum canonical organization representation versus run-specific descriptive fields
  - exact universal generality beyond two domains; observation only, no work triggered
  - whether decision-delta clarification should eventually become reusable pre-organization behavior rather than an experimental responsibility name
  - exact minimal/bias-optimal context projection rule
  - how later organization changes disposition already existing work; defer to WP5
  - responsibility retirement and issue lifecycle projection; defer to WP5
  - runtime SIGNAL behavior and interface ownership under substantive execution; defer to WP5 and do not introduce an Interface Manager
  - long-term reporting/artifact design in WP2
  - quality/decision learning protocol in WP3
  - divergence/convergence implementation mechanisms in WP4
  - dynamic organization and closure mechanics in WP5

known_nonblocking_anomalies:
  - Modelrail terminal state and GitHub issue lifecycle/status can diverge; treat as later lifecycle evidence
  - PROJECT_STATE requires explicit projection refresh after live runs
  - Proof 003 contains historical leaf issues whose conversation_id was pre-bound inconsistently; preserve as evidence rather than rewriting history
  - Proof 004 terminal broker state recorded one successful quiescence recovery resolved on attempt 1; exact cause is unknown and no Core change is justified from one event

non_goals_now:
  - add permanent Organization Architect, Mission Clarifier, Reviewer, Auditor, Tester, Consultant, or Interface Manager roles to Core
  - add a fixed generic, Keto, or trading intake questionnaire
  - add a terminal UI or new Modelrail Core human-input action
  - add a new authority/execution kind without a demonstrated enforcement gap
  - add a permanent whole-topology machine gate/action
  - add extra responsibility lifecycle states before WP5 evidence
  - change Modelrail main
  - run another broad domain proof solely to accumulate examples
  - use topology similarity, wall-clock duration, token quotas, arbitrary hierarchy depth, or arbitrary worker counts as quality criteria
