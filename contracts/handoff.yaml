contract:
  id: mandate.execution_handoff
  version: "0.1"
  purpose: >-
    Define the complete machine boundary between GitHub semantic state and the execution broker.
    The broker transports addressed execution work; it does not interpret domain semantics.

response_envelope:
  required_fields:
    - run_id
    - handoffs
  fields:
    run_id:
      type: string
    handoffs:
      type: list
      min_items: 1
      description: >-
        One completed execution may emit multiple independent DISPATCH handoffs so the broker
        can submit them concurrently. RUNNING_WAIT, PAUSE, and TERMINATE are exclusive and
        therefore must be the sole handoff in an envelope.

semantic_actions:
  DISPATCH:
    required_fields:
      - action
      - message_id
      - from_responsibility_id
      - to_responsibility_id
      - issue_number
    behavior: >-
      Resolve the target responsibility to its durable conversation. Continue the existing
      conversation when bound; otherwise create a fresh conversation using the run's routing
      convention, persist transport identity, send the fixed task-attention prompt, wait for
      one completed TurnResult, and process the returned handoff envelope.

  RUNNING_WAIT:
    required_fields:
      - action
      - message_id
      - from_responsibility_id
    behavior: >-
      Emit no new workload. The broker continues already queued or in-flight work. This action
      does not pause the run and is invalid when there is no other queued or in-flight work.

  PAUSE:
    required_fields:
      - action
      - message_id
      - from_responsibility_id
      - reason
    authority_required: run_control
    behavior: stop autonomous dispatch without terminating the run

  TERMINATE:
    required_fields:
      - action
      - message_id
      - from_responsibility_id
      - outcome
    authority_required: run_control
    outcome_enum:
      - SUCCESS
      - FAILURE
    behavior: terminate the run

broker_phases:
  - IDLE
  - RUNNING_WAIT
  - PAUSED
  - TERMINAL

routing:
  key: to_responsibility_id
  lookup: run organization responsibility -> conversation_id
  default:
    existing_binding: CONTINUE
    missing_binding: FRESH_AND_PERSIST
  provider_url: modelrail_owned_detail

fixed_dispatch_prompt:
  template: |-
    Repository: {repository}
    Run: {run_id}
    Assigned responsibility: {responsibility_id}
    Modelrail conversation: {conversation_id}
    Assigned task issue: #{issue_number}

    Read the exact canonical resources authorized by the task and responsibility routing.
    Execute only the assigned closed contract. Persist the required semantic result in GitHub.
    Then emit exactly one terminal mandate.execution_handoff response envelope and stop.

invariants:
  - one DISPATCH handoff addresses one responsibility
  - multiple independent DISPATCH handoffs in one envelope may execute concurrently
  - a responsibility conversation processes its own Turns sequentially
  - message_id is unique within a run and duplicate message IDs are not redispatched
  - handoff from_responsibility_id must match the responsibility whose Turn produced it
  - RUNNING_WAIT creates no work and does not pause the run
  - the broker never decides semantic acceptance
  - the broker never invents tasks, responsibilities, signals, pause, or termination
  - PAUSE and TERMINATE are rejected unless sender has run_control authority
