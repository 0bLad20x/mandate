contract:
  id: mandate.responsibility
  version: "0.3"
  purpose: >-
    Define one concrete responsibility instance in a run organization. Titles do not
    confer authority; authority is explicit. Responsibility identity and execution-
    conversation activation are distinct concepts. A responsibility boundary records
    why the node exists and what material adjacent scope it must not absorb without
    prescribing a role taxonomy, team shape, headcount, hierarchy depth, or method.

required_fields:
  - responsibility_id
  - run_id
  - title
  - kind
  - parent_responsibility_id
  - authority
  - mandate
  - prohibited_scope
  - conversation_id

fields:
  responsibility_id:
    type: string
    description: >-
      Stable canonical identity within the run. This is the identity used for accountability
      and routing. It exists before any Modelrail conversation is necessarily created.

  run_id:
    type: string

  title:
    type: string
    description: human-readable responsibility name

  kind:
    enum:
      - RUN_AUTHORITY
      - RESPONSIBILITY

  parent_responsibility_id:
    type:
      - string
      - null
    constraints:
      - RUN_AUTHORITY must have null parent
      - every RESPONSIBILITY must have exactly one parent

  authority:
    type: object
    fields:
      delegate:
        type: boolean
      accept_child_results:
        type: boolean
      run_control:
        type: boolean
    constraints:
      - run_control may be true only for kind RUN_AUTHORITY
      - child authority may not exceed delegated parent authority

  mandate:
    type: string
    description: >-
      Compact persistent ownership boundary for this responsibility: state which inherited
      mission obligation, judgment, uncertainty, risk, or deliverable this responsibility
      materially owns or can change and therefore why the node exists. State the responsibility,
      not a preferred method, conventional job title, output heading, worker count, or topology shape.

  prohibited_scope:
    type: list
    description: >-
      Material adjacent authority or ownership this responsibility must not absorb. Keep this
      bounded to real ambiguity or failure risk; do not enumerate every conceivable non-responsibility.

  conversation_id:
    type:
      - string
      - null
    description: >-
      Durable Modelrail conversation binding created by the execution broker when this
      responsibility is first actually dispatched/activated. Keep null while the responsibility
      is only canonically defined and has never been started. A predictable future conversation
      name is not yet a bound conversation and must not be persisted as though it already exists.

  conduct_refs:
    type: list
    default:
      - C_CORE

  status:
    enum:
      - ACTIVE
      - RETIRED
    default: ACTIVE
    description: >-
      Organizational membership/lifecycle status only. ACTIVE means the responsibility currently
      exists in the canonical run organization and has not been retired. It does not imply that a
      Modelrail conversation exists, that a substantive task has been released, or that work is
      pending/running. Execution state belongs to broker/task state, not this status field.

invariants:
  - responsibility_id is the canonical responsibility/routing identity; conversation_id is only its durable execution-context binding
  - every non-run-authority responsibility has one parent and one compact mandate that justifies its existence by inherited mission relevance
  - mandate and prohibited_scope define ownership boundaries but do not prescribe organization shape, role taxonomy, methods, output headings, headcount, or hierarchy depth
  - authority/execution behavior is determined by explicit authority plus delegated tasks/results; do not add a permanent AUTHORITY or EXECUTION kind merely to label a run-specific classification
  - ACTIVE with conversation_id null is valid for a responsibility that is defined in the organization but has never been dispatched
  - the execution broker binds conversation_id on first dispatch/activation; organization design must not pre-bind an unstarted responsibility merely because the deterministic name is knowable
  - one responsibility instance maps to at most one active durable conversation
  - task volume does not create new conversations; additional tasks for an already-started responsibility continue its existing conversation
  - responsibility status does not encode task release, queue/pending state, or substantive execution state
  - conversation history is context, while GitHub remains canonical authority
