contract:
  id: mandate.responsibility
  version: "0.1"
  purpose: >-
    Define one concrete responsibility instance in a run organization. Titles do not
    confer authority; authority is explicit.

required_fields:
  - responsibility_id
  - run_id
  - title
  - kind
  - parent_responsibility_id
  - authority
  - conversation_id

fields:
  responsibility_id:
    type: string
    description: stable identity within the run

  run_id:
    type: string

  title:
    type: string
    description: human-readable responsibility name

  kind:
    enum:
      - RUN_AUTHORITY
      - RESPONSIBILITY

  parent_responsibility_id:
    type:
      - string
      - null
    constraints:
      - RUN_AUTHORITY must have null parent
      - every RESPONSIBILITY must have exactly one parent

  authority:
    type: object
    fields:
      delegate:
        type: boolean
      accept_child_results:
        type: boolean
      run_control:
        type: boolean
    constraints:
      - run_control may be true only for kind RUN_AUTHORITY
      - child authority may not exceed delegated parent authority

  conversation_id:
    type:
      - string
      - null
    description: >-
      Durable Modelrail conversation binding for this responsibility instance. Null only
      until the execution broker creates the first conversation for a newly activated responsibility.

  conduct_refs:
    type: list
    default:
      - C_CORE

  status:
    enum:
      - ACTIVE
      - RETIRED
    default: ACTIVE

invariants:
  - one responsibility instance maps to at most one active durable conversation
  - task volume does not create new conversations; new responsibility instances do
  - conversation history is context, while GitHub remains canonical authority
